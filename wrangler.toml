name = "ai-biodata-maker"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

# Free AI: Cloudflare Workers AI (10,000 free "neurons" per day, no API key needed).
[ai]
binding = "AI"

[vars]
PRICE_PAISE = "5000"          # ₹50
# WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"   # optional override
# AI_MODEL = "claude-haiku-5-5"                         # used only if ANTHROPIC_API_KEY is set
# Secrets (set in Cloudflare dashboard as type "Secret", never here):
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET
#   ANTHROPIC_API_KEY  (optional: switches AI from free Workers AI to Claude for better Tamil)
